# Copy this file to shopify-admin-skills/.github/workflows/dispatch-to-consumers.yml
#
# Required secret in shopify-admin-skills repo:
#   DISPATCH_TOKEN — a GitHub PAT with repo scope for both Claudecode and boco-agency
#
name: Dispatch skill update to consumers

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [Claudecode, boco-agency]
    steps:
      - name: Trigger sync in ${{ matrix.repo }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: sobankousik/${{ matrix.repo }}
          event-type: skills-updated
