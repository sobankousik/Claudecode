name: Sync shopify-admin-skills

on:
  repository_dispatch:
    types: [skills-updated]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: claude/shopify-plugin-integration-0i4sR

      - name: Update shopify-admin-skills submodule to latest
        run: git submodule update --remote shopify-admin-skills

      - name: Commit updated submodule pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shopify-admin-skills
          git diff --cached --quiet || git commit -m "chore: sync shopify-admin-skills to latest"

      - name: Push
        run: git push origin claude/shopify-plugin-integration-0i4sR
